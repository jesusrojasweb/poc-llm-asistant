<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Dark-themed Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
    <div class="admin-container">
        <h1>Admin Dashboard</h1>
        <a href="{{ url_for('index') }}" class="back-button">Back to Chat</a>
        {% for data in user_data %}
            <div class="user-section">
                <h2>User: {{ data.user.username }}</h2>
                <p>Email: {{ data.user.email }}</p>
                <h3>Chat History:</h3>
                <div class="chat-history">
                    {% for message in data.chat_history %}
                        <div class="message {% if message.is_user %}user-message{% else %}bot-message{% endif %}">
                            <p>{{ message.content }}</p>
                            <small>{{ message.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</small>
                        </div>
                    {% endfor %}
                </div>
            </div>
        {% endfor %}
    </div>
    <script>
        feather.replace();
    </script>
</body>
</html>
