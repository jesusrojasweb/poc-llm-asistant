<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Dark-themed Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
    <div class="admin-container">
        <h1>Admin Dashboard</h1>
        <a href="{{ url_for('index') }}" class="back-button">Back to Chat</a>

        <div class="admin-summary">
            <h2>Overall Statistics</h2>
            <p>Total Users: <span id="total-users"></span></p>
            <p>Total Messages: <span id="total-messages"></span></p>
            <p>Average Messages per User: <span id="avg-messages-per-user"></span></p>
        </div>

        <div class="admin-content">
            <div class="user-list">
                <h2>Users</h2>
                <input type="text" id="user-search" placeholder="Search users...">
                <ul id="user-list"></ul>
                <div id="user-pagination"></div>
            </div>
            <div class="chat-display">
                <h2>Chat History</h2>
                <div id="chat-history"></div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
    <script>
        feather.replace();
    </script>
</body>
</html>
